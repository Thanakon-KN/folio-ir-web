<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dialog Studio · ออกแบบ Popup จากข้อความ</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#152137;--muted:#52647a;--line:#d9dfe8;--blue:#214fd1;--paper:#fff;font:16px/1.55 Inter,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:#f5f7fa}
body{margin:0}header,main{width:min(1480px,100%);margin:auto}header{height:74px;display:flex;align-items:center;gap:13px;padding:0 clamp(18px,4vw,66px)}.top{border-bottom:1px solid var(--line);background:white}
.brand{font-size:21px;font-weight:750;letter-spacing:-.7px}.mark{width:33px;height:33px;background:var(--blue);border-radius:9px;display:grid;place-content:center;color:white;font:750 23px Georgia}.context{margin-left:auto;font-size:14px;color:var(--muted)}
main{padding:clamp(24px,3vw,46px) clamp(18px,4vw,66px) 40px}h1,h2,p{margin:0}h1{font-size:clamp(27px,3vw,43px);line-height:1.2;letter-spacing:-1.3px}.intro p{color:var(--muted);margin-top:7px}.desk{margin-top:24px;display:grid;grid-template-columns:minmax(300px,.77fr) minmax(0,1.55fr);gap:22px;align-items:start}.card{border:1px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden}
.settings{padding:clamp(18px,2vw,29px)}h2{font-size:20px;letter-spacing:-.4px}.group{margin-top:21px}.label,summary{font-weight:650;font-size:15px}.sizes{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}.times{padding-bottom:12px;color:var(--muted)}
.field{display:block;position:relative}.field input{padding-right:35px}.unit{position:absolute;right:12px;bottom:11px;font-size:13px;color:var(--muted);pointer-events:none}
input,textarea,select,button{font:inherit}input,textarea,select{border:1px solid #c4ceda;border-radius:9px;background:#fff;color:var(--ink)}input,textarea{display:block;width:100%;min-width:0;padding:9px 12px;margin-top:6px}textarea{resize:vertical;line-height:1.65;min-height:165px}textarea::placeholder,input::placeholder{color:#748397}.labelrow,.bar,.actions,.exports{display:flex;align-items:center;gap:10px}.labelrow,.bar{justify-content:space-between}.bar{padding:16px 20px;border-bottom:1px solid var(--line)}.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.actions{justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
button,select{cursor:pointer}button{font-weight:650;border-radius:8px;border:1px solid var(--line);padding:8px 13px;background:white;color:var(--ink)}button:hover:not(:disabled){background:#edf2ff}button:disabled{opacity:.42;cursor:default}.sample{padding:2px 0;color:var(--blue);border:0;font-size:14px}.primary{color:white;background:var(--blue);border-color:var(--blue)}.primary:hover:not(:disabled){background:#183ea8}select{padding:8px 28px 8px 10px;appearance:none;background:linear-gradient(45deg,transparent 50%,#53627a 50%) calc(100% - 14px) 51%/5px 5px no-repeat,linear-gradient(135deg,#53627a 50%,transparent 50%) calc(100% - 9px) 51%/5px 5px no-repeat}
:focus-visible{outline:3px solid #789cff;outline-offset:2px}details{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}summary{cursor:pointer}details label{display:block;margin-top:12px}
.stage{padding:clamp(18px,3vw,45px);background-color:#ebeff5;background-image:radial-gradient(#bbc7d6 1px,transparent 1px);background-size:14px 14px;min-height:340px;height:clamp(340px,49vh,550px);display:grid;place-items:center;overflow:hidden}canvas{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;filter:drop-shadow(0 7px 10px #142c572c)}.notice{font-size:14px;color:#8b361d;margin:12px 0 0}.status{padding:0 18px 12px;font-size:14px;color:var(--muted)}.status:empty,.notice:empty{display:none}
@media(max-width:850px){.desk{grid-template-columns: minmax(250px,.85fr) minmax(0,1.25fr);gap:12px}.actions{padding:12px}.stage{padding:16px}.bar{padding:15px}}
@media(max-width:690px){header{height:60px}.desk{grid-template-columns:1fr}.stage{height:310px;min-height:0}.settings{padding:18px}.context{display:none}textarea{min-height:110px}.group{margin-top:15px}.actions{gap:8px}.intro p{font-size:15px}}
</style>
</head>
<body>
<div class="top"><header><span class="mark" aria-hidden="true">d</span><span class="brand" lang="en">Dialog Studio</span><span class="context">ออกแบบ Popup</span></header></div>
<main>
<div class="intro"><h1>สร้าง Popup จากข้อความ</h1><p>กำหนดขนาดแล้ววางข้อความ พรีวิวจะจัดหน้าให้ทันที</p></div>
<div class="desk">
<section class="card settings" aria-labelledby="settingsTitle">
<h2 id="settingsTitle">ตั้งค่าชิ้นงาน</h2>
<div class="group sizes">
<label class="field"><span class="label">ความกว้าง</span><input id="width" type="number" min="240" max="4000" step="1" value="1200"><span class="unit" aria-hidden="true">px</span></label>
<span class="times" aria-hidden="true">×</span>
<label class="field"><span class="label">ความสูง</span><input id="height" type="number" min="180" max="4000" step="1" value="800"><span class="unit" aria-hidden="true">px</span></label>
</div>
<div class="group"><div class="labelrow"><label for="copy" class="label">ข้อความบน Popup</label><button class="sample" id="sample" type="button">ใช้ข้อความตัวอย่าง</button></div>
<textarea id="copy" rows="5" placeholder="วางหัวข้อและรายละเอียดไว้ที่นี่"></textarea></div>
<details><summary>เพิ่มปุ่มและลิงก์</summary>
<label class="label" for="buttonText">ข้อความบนปุ่ม</label><input id="buttonText" placeholder="เช่น ดูรายละเอียด">
<label class="label" for="buttonUrl">ลิงก์ปลายทาง</label><input id="buttonUrl" type="url" placeholder="https://…">
</details>
<p id="warning" class="notice" role="status"></p>
</section>
<section class="card" aria-labelledby="previewTitle">
<div class="bar"><h2 id="previewTitle">พรีวิว</h2><span class="meta" id="dimensions"></span></div>
<div class="stage"><canvas id="art" aria-label="ตัวอย่าง Popup"></canvas></div>
<div class="actions"><button id="variation" type="button">เปลี่ยนดีไซน์</button><div class="exports"><select id="format" aria-label="รูปแบบไฟล์"><option>PNG</option><option>JPG</option><option>WebP</option><option>HTML</option></select><button class="primary" id="download" type="button">ดาวน์โหลด</button></div></div>
<p class="status" id="status" role="status"></p>
</section>
</div></main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const canvas = byId('art');
const ctx = canvas.getContext('2d');
const example = 'เปิดโอกาสให้ผู้ถือหุ้นเสนอวาระการประชุม\nขอเชิญผู้ถือหุ้นเสนอวาระและรายชื่อบุคคลเพื่อเข้ารับการพิจารณาเลือกตั้งเป็นกรรมการ สำหรับการประชุมสามัญผู้ถือหุ้น ประจำปี 2570';
const wordBreaker = typeof Intl.Segmenter === 'function' ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
const graphemeBreaker = wordBreaker && new Intl.Segmenter('th', { granularity: 'grapheme' });

function linesFor(context, text, width) {
  const lines = [];
  const fits = value => context.measureText(value).width <= width;
  for (const paragraph of text.split(/\r\n?|\n/)) {
    let line = '';
    let spaces = '';
    const words = wordBreaker
      ? Array.from(wordBreaker.segment(paragraph), part => part.segment)
      : paragraph.match(/\s+|\S+/gu) || [];
    for (const word of words) {
      if (/^\s+$/u.test(word)) {
        spaces += word;
        continue;
      }
      const candidate = line + spaces + word;
      spaces = '';
      if (fits(candidate)) {
        line = candidate;
        continue;
      }
      if (line) lines.push(line);
      line = word;
      if (fits(word)) continue;
      // A single word wider than the box still needs to fit without splitting a combining mark.
      const clusters = graphemeBreaker
        ? Array.from(graphemeBreaker.segment(word), part => part.segment)
        : word.match(/\P{M}\p{M}*|\p{M}+/gu) || [];
      line = '';
      for (const cluster of clusters) {
        if (line && !fits(line + cluster)) {
          lines.push(line);
          line = '';
        }
        line += cluster;
      }
    }
    lines.push(line);
  }
  return lines;
}

const font = 'Arial,"Leelawadee UI",Tahoma,sans-serif';
const setFont = (weight, size) => { ctx.font = weight + ' ' + size + 'px ' + font; };
let variation = 0;
let pendingFrame = 0;
let artwork = null;

function splitCopy(value) {
  const text = value.trim().replace(/\r\n?/g, '\n');
  const lineBreak = text.indexOf('\n');
  if (lineBreak > 0) return [text.slice(0, lineBreak), text.slice(lineBreak).trimStart()];
  const sentence = /^(.{5,}?[.!?。！？])(?:\s+|(?=[ก-๙]))/u.exec(text);
  if (sentence) return [sentence[1], text.slice(sentence[0].length)];
  if (text.length <= 62) return [text, ''];
  const lead = text.slice(0, 82);
  const breaks = Array.from(lead.matchAll(/\s+|(?=เพื่อ|โดย|สำหรับ|ตั้งแต่|เนื่องจาก|พร้อมทั้ง|ขอเชิญ)/gu))
    .filter(part => part.index >= 18);
  let boundary = breaks[0]?.index;
  if (!boundary && wordBreaker) {
    const words = Array.from(wordBreaker.segment(text.slice(0, 110)));
    boundary = words.find(word => word.index >= 44)?.index;
  }
  return boundary ? [text.slice(0, boundary).trimEnd(), text.slice(boundary).trimStart()] : [text, ''];
}

function seedFrom(text) {
  let seed = 2166136261;
  for (const char of text) seed = Math.imul(seed ^ char.codePointAt(0), 16777619);
  return seed >>> 0;
}

function paintBackdrop(w, h, text) {
  const seed = seedFrom(text);
  const base = /สิ่งแวดล้อม|ยั่งยืน|sustainab|green/i.test(text) ? 159 :
    /เทศกาล|ฉลอง|festival/i.test(text) ? 325 :
    /ประชุม|ผู้ถือหุ้น|shareholder/i.test(text) ? 218 : seed % 360;
  const hue = (base + variation * 47) % 360;
  const grad = ctx.createLinearGradient(0, 0, w, h * .82);
  grad.addColorStop(0, 'hsl(' + hue + ' 59% 13%)');
  grad.addColorStop(.64, 'hsl(' + hue + ' 60% 24%)');
  grad.addColorStop(1, 'hsl(' + ((hue + 19) % 360) + ' 69% 40%)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.scale(w, h);
  const shift = ((seed % 17) / 100 + variation * .035) % .22;
  ctx.lineWidth = .0015;
  for (let i = 0; i < 85; i++) {
    const t = i / 84;
    ctx.strokeStyle = 'hsla(' + ((hue + 35) % 360) + ',93%,81%,' + (.12 + .45 * t) + ')';
    ctx.beginPath();
    ctx.moveTo(.56 + t * .33 + shift, -.15);
    ctx.bezierCurveTo(1.49 - t * .19, .32, .40 + t * .5, .40 + t * .55, 1.08 + t * .15, 1.12);
    ctx.stroke();
  }
  ctx.restore();
}

function measureLayout(w, h, title, body, button) {
  const short = Math.min(w, h);
  const x = Math.round(w * .085);
  const textWidth = w - 2 * x;
  const maxHeight = h * .81;
  const start = Math.max(15, Math.min(200, Math.round(Math.min(w * .082, h * .117))));
  const pad = Math.max(6, short * .026);
  let smallest = 9, largest = start, best = null;
  while (smallest <= largest) {
    const size = Math.floor((smallest + largest) / 2);
    const blocks = [];
    let used = 0;
    for (const [kind, text, px, weight] of [['title', title, size, 700], ['body', body, Math.max(9, size * .46), 400], ['button', button, Math.max(9, size * .38), 700]]) {
      if (!text) continue;
      const isButton = kind === 'button';
      setFont(weight, px);
      const lines = linesFor(ctx, text, textWidth - (isButton ? pad * 2 : 0));
      const lineH = px * 1.5;
      const bh = lineH * lines.length + (isButton ? pad * .8 : 0);
      const bw = isButton ? Math.min(textWidth, Math.max(...lines.map(line => ctx.measureText(line).width)) + 2 * pad) : textWidth;
      if (blocks.length) used += Math.max(4, size * (isButton ? .48 : .31));
      blocks.push({kind, lines, px, weight, w:bw, h:bh, x, y:used, lineH});
      used += bh;
    }
    if (used <= maxHeight) {
      for (const block of blocks) block.y += (h - used) / 2;
      best = blocks;
      smallest = size + 1;
    } else largest = size - 1;
  }
  return best;
}

function render() {
  const w = byId('width').valueAsNumber, h = byId('height').valueAsNumber;
  const input = byId('copy').value.trim();
  const text = input || example;
  const button = byId('buttonText').value.trim();
  const link = byId('buttonUrl').value.trim();
  let url = '', error = '', painted = false;
  if (link) {
    try { const target = new URL(link); if (['http:', 'https:'].includes(target.protocol)) url = target.href; } catch {}
  }
  artwork = null;
  byId('sample').hidden = Boolean(input);
  byId('download').disabled = true;
  byId('status').textContent = '';
  if (![w,h].every(Number.isInteger) || w < 240 || w > 4000 || h < 180 || h > 4000) error = 'กำหนดความกว้าง 240–4000 px และความสูง 180–4000 px';
  else if (text.length > 8000 || button.length > 250) error = 'รองรับข้อความสูงสุด 8,000 ตัวอักษร และข้อความปุ่ม 250 ตัวอักษร';
  if (!error) {
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    const [title, body] = splitCopy(text);
    const blocks = measureLayout(w, h, title, body, button);
    if (!blocks) error = 'ข้อความยาวเกินพื้นที่ ลองเพิ่มขนาด Popup หรือย่อข้อความ';
    else {
      paintBackdrop(w, h, text);
      ctx.textBaseline = 'middle';
      for (const block of blocks) {
        const isButton = block.kind === 'button';
        if (isButton) {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.roundRect(block.x, block.y, block.w, block.h, Math.min(block.h / 2, block.px * .45));
          ctx.fill();
        }
        setFont(block.weight, block.px);
        ctx.textAlign = isButton ? 'center' : 'left';
        ctx.fillStyle = isButton ? '#16223c' : block.kind === 'body' ? '#ebefff' : '#fff';
        const left = block.x + (isButton ? block.w / 2 : 0);
        const top = block.y + (block.h - block.lines.length * block.lineH) / 2;
        block.lines.forEach((line, n) => ctx.fillText(line, left, top + (n + .5) * block.lineH));
      }
      canvas.setAttribute('aria-label', text);
      painted = true;
      if (link && !url) error = 'ใส่ลิงก์ที่ขึ้นต้นด้วย https:// หรือ http://';
      else if (link && !button) error = 'ใส่ข้อความบนปุ่มเพื่อใช้ลิงก์นี้';
      if (input && !error) artwork = {w,h,text,button,url,box:blocks.find(block => block.kind === 'button')};
      byId('dimensions').textContent = (input ? '' : 'ตัวอย่าง · ') + w + ' × ' + h + ' px';
    }
  }
  if (!painted) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.setAttribute('aria-label',error);
    byId('dimensions').textContent = 'ตรวจสอบชิ้นงาน';
  }
  byId('warning').textContent = error;
  byId('download').disabled = !artwork;
}
function refresh() {
  cancelAnimationFrame(pendingFrame);
  pendingFrame = requestAnimationFrame(render);
}

function exportHtml(design) {
  const doc = document.implementation.createHTMLDocument('Popup');
  doc.documentElement.lang = 'th';
  const meta = doc.createElement('meta');
  const encoding = doc.createElement('meta');
  encoding.setAttribute('charset','utf-8');
  meta.name = 'viewport';
  meta.content = 'width=device-width,initial-scale=1';
  doc.head.prepend(encoding, meta);
  doc.body.style.margin = '0';
  const frame = doc.createElement('div');
  frame.style.cssText = 'position:relative;max-width:' + design.w + 'px;margin:auto';
  const image = doc.createElement('img');
  image.src = canvas.toDataURL('image/png');
  image.alt = design.text + (design.button ? ' ' + design.button : '');
  image.style.cssText = 'display:block;width:100%;height:auto';
  frame.append(image);
  if (design.url && design.box) {
    const a = doc.createElement('a'), b = design.box;
    a.href = design.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label',design.button);
    a.style.cssText = 'position:absolute;left:' + 100*b.x/design.w + '%;top:' + 100*b.y/design.h + '%;width:' + 100*b.w/design.w + '%;height:' + 100*b.h/design.h + '%';
    frame.append(a);
  }
  doc.body.append(frame);
  return new Blob(['<!doctype html>\n',doc.documentElement.outerHTML], {type:'text/html;charset=utf-8'});
}
byId('download').onclick = async () => {
  cancelAnimationFrame(pendingFrame);
  render();
  if (!artwork) return;
  const design = artwork;
  const ext = byId('format').value.toLowerCase();
  const mime = {png:'image/png',jpg:'image/jpeg',webp:'image/webp'}[ext];
  try {
    const blob = ext === 'html' ? exportHtml(design) : await new Promise(resolve => canvas.toBlob(resolve,mime,.94));
    if (!blob || (mime && blob.type !== mime)) throw new Error();
    const a = document.createElement('a');
    const objectUrl = URL.createObjectURL(blob);
    a.href = objectUrl;
    a.download = 'popup-' + design.w + 'x' + design.h + '.' + ext;
    document.body.append(a);
    a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);
    byId('status').textContent = 'เตรียมไฟล์ ' + ext.toUpperCase() + ' แล้ว';
  } catch { byId('status').textContent = 'ส่งออกไฟล์ไม่ได้ ลองเปลี่ยนรูปแบบไฟล์หรือขนาดชิ้นงาน'; }
};
byId('sample').onclick = () => { byId('copy').value = example; variation = 0; refresh(); };
byId('variation').onclick = () => { variation++; refresh(); };
for (const id of ['width','height','copy','buttonText','buttonUrl']) byId(id).addEventListener('input', refresh);
render();
</script>
</body>
</html>
